<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <title>{% block title %}Flask App - Secure{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .navbar { background: #28a745; color: white; padding: 15px; }
        .navbar a { color: white; text-decoration: none; margin-right: 20px; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; background: white; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        .error { color: red; margin: 10px 0; padding: 10px; background: #ffe6e6; border-radius: 4px; }
        .success { color: green; margin: 10px 0; padding: 10px; background: #e6ffe6; border-radius: 4px; }
        .field-error { color: red; font-size: 0.9em; margin-top: 5px; }
        .secure-badge { background: #28a745; color: white; padding: 5px 10px; border-radius: 3px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="secure-badge">SECURE VERSION</span>
        <a href="/">Home</a>
        {% if session.username %}
            <a href="/dashboard">Dashboard</a>
            <a href="/contact">Contact</a>
            <a href="/contacts">View Contacts</a>
            <a href="/search">Search</a>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
